<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      .t { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 13px; fill: #475569; }
      .b { font-size: 14px; fill: #1e293b; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; fill: #1e293b; }
      .lbl { font-size: 13px; fill: #334155; font-weight: 600; }
      .num { font-size: 13px; font-weight: 700; fill: #fff; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#f7f8fb"/>

  <!-- ===== Web ===== -->
  <rect x="40" y="40" width="660" height="170" rx="16" fill="#fff8eb" stroke="#f59e0b" stroke-width="2"/>
  <text x="64" y="74" class="t">web/ · React PWA (Vercel)</text>
  <text x="64" y="96" class="s">one app, four roles · wallet = MetaMask on Arc testnet</text>
  <text x="64" y="128" class="b">Resident: live power, solar %, monthly bill → Pay in USDC</text>
  <text x="64" y="152" class="b">Admin: panel health, post a cleaning job, close the month</text>
  <text x="64" y="176" class="b">Cleaner: Accept job → paid automatically when the panel is clean</text>
  <text x="64" y="200" class="b">Shop: prepay for spare noon solar</text>

  <!-- ===== Pi ===== -->
  <rect x="40" y="270" width="660" height="290" rx="16" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="64" y="304" class="t">Raspberry Pi 4 · pi/ (Python)</text>
  <text x="64" y="326" class="s">the building's brain and its meter: holds the oracle wallet</text>
  <text x="64" y="360" class="b">Meter loop: 4× INA219 → signed 1-minute readings (SQLite, 7 days)</text>
  <text x="64" y="386" class="b">Dyna planner: tomorrow's sharing plan + pump window, asks 0G</text>
  <text x="64" y="412" class="b">CleaningWatch: output &lt; 70% → open escrow · ≥ 90% → release</text>
  <text x="64" y="438" class="b">Shop sales: settle per Wh after the solar window · bills: post monthly</text>
  <text x="64" y="464" class="b">FastAPI: /api/state, /api/stream (SSE), admin routes</text>
  <text x="64" y="490" class="b">bridge.mjs: one write queue to Arkiv (never blocks the meter)</text>
  <text x="64" y="530" class="m">oracle = Pi wallet: the only key that can release, settle or bill</text>

  <!-- ===== Hardware ===== -->
  <rect x="40" y="620" width="320" height="180" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="64" y="654" class="t">Cardboard building</text>
  <text x="64" y="684" class="b">5 W panel under a desk lamp</text>
  <text x="64" y="708" class="b">Flats A · B · C + water pump</text>
  <text x="64" y="732" class="b">4-ch relays: solar / grid per flat</text>
  <text x="64" y="756" class="b">LEDs: yellow = solar, blue = grid</text>
  <text x="64" y="780" class="b">INA219 0x40 / 41 / 44 / 45</text>

  <!-- ===== Hero flow ===== -->
  <rect x="390" y="620" width="310" height="180" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="410" y="646" class="lbl">The hero moment</text>
  <g class="b">
    <circle cx="420" cy="668" r="9" fill="#0f172a"/><text x="416" y="672" class="num">1</text>
    <text x="438" y="673">Paper on the panel: output drops</text>
    <circle cx="420" cy="690" r="9" fill="#7c3aed"/><text x="416" y="694" class="num">2</text>
    <text x="438" y="695">0G flags panel_dirty (request ID)</text>
    <circle cx="420" cy="712" r="9" fill="#2563eb"/><text x="416" y="716" class="num">3</text>
    <text x="438" y="717">Pi locks USDC in CleaningEscrow</text>
    <circle cx="420" cy="734" r="9" fill="#d97706"/><text x="416" y="738" class="num">4</text>
    <text x="438" y="739">Cleaner accepts, peels the paper</text>
    <circle cx="420" cy="756" r="9" fill="#059669"/><text x="416" y="760" class="num">5</text>
    <text x="438" y="761">Meter ≥ 90% → USDC released</text>
    <circle cx="420" cy="778" r="9" fill="#475569"/><text x="416" y="782" class="num">6</text>
    <text x="438" y="783">Every step on Arkiv, with 0G proof</text>
  </g>

  <!-- ===== Arc ===== -->
  <rect x="820" y="40" width="540" height="290" rx="16" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="844" y="74" class="t">Arc testnet · pays (USDC)</text>
  <text x="844" y="96" class="s">USDC ERC-20 0x3600…0000, 6 decimals · also the gas</text>
  <rect x="840" y="110" width="160" height="140" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="852" y="134" class="lbl">CleaningEscrow</text>
  <text x="852" y="158" class="s">lock → accept</text>
  <text x="852" y="178" class="s">release if ≥ 90%</text>
  <text x="852" y="198" class="s">dispute · refund</text>
  <text x="852" y="218" class="s">+ 0G request ID</text>
  <text x="852" y="238" class="s">+ 0G episode root</text>
  <rect x="1010" y="110" width="160" height="140" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="1022" y="134" class="lbl">ShopTrade</text>
  <text x="1022" y="158" class="s">shop prepays</text>
  <text x="1022" y="178" class="s">meter settles per Wh</text>
  <text x="1022" y="198" class="s">rest refunded</text>
  <text x="1022" y="218" class="s">in the same tx</text>
  <rect x="1180" y="110" width="160" height="140" rx="10" fill="#ffffff" stroke="#93c5fd"/>
  <text x="1192" y="134" class="lbl">SolarBilling</text>
  <text x="1192" y="158" class="s">bill per flat meter</text>
  <text x="1192" y="178" class="s">one payment, split:</text>
  <text x="1192" y="198" class="s">solar → society</text>
  <text x="1192" y="218" class="s">grid → electricity</text>
  <text x="1192" y="238" class="s">board</text>
  <rect x="840" y="262" width="500" height="52" rx="10" fill="#2563eb"/>
  <text x="858" y="285" font-size="14" font-weight="700" fill="#ffffff">Arc Studio</text>
  <text x="858" y="303" font-size="13" fill="#dbeafe">contracts generated, Foundry-tested and deployed from Studio</text>

  <!-- ===== 0G ===== -->
  <rect x="820" y="380" width="540" height="170" rx="16" fill="#f3effe" stroke="#7c3aed" stroke-width="2"/>
  <text x="844" y="414" class="t">0G · decides</text>
  <text x="844" y="446" class="b">Compute Router (TEE): plan + panel_dirty</text>
  <text x="844" y="470" class="b">a request ID per decision, TEE-verified</text>
  <text x="844" y="500" class="b">Storage: each decision's episode log → root</text>
  <text x="844" y="524" class="b">EpisodeRegistry (Galileo): root ↔ request ID</text>

  <!-- ===== Arkiv ===== -->
  <rect x="820" y="620" width="540" height="180" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="844" y="654" class="t">Arkiv · remembers</text>
  <text x="844" y="686" class="b">readings · decisions (+ 0G request ID, root)</text>
  <text x="844" y="710" class="b">cleaning jobs and maintenance (+ Arc tx)</text>
  <text x="844" y="734" class="b">shop offers that expire at sunset · heartbeat</text>
  <text x="844" y="766" class="s">public, queryable, expiring records (Rabdi)</text>

  <!-- ===== arrows ===== -->
  <!-- web -> Arc -->
  <line x1="700" y1="125" x2="818" y2="125" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="712" y="112" class="lbl" fill="#2563eb">MetaMask</text>
  <text x="712" y="146" class="s">accept · pay</text>
  <text x="712" y="162" class="s">prepay</text>
  <circle cx="760" cy="182" r="10" fill="#d97706"/><text x="756" y="187" class="num">4</text>

  <!-- web <-> Pi -->
  <line x1="370" y1="212" x2="370" y2="268" stroke="#475569" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="384" y="245" class="s">REST + live SSE</text>

  <!-- Pi -> Arc -->
  <line x1="700" y1="300" x2="818" y2="300" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="708" y="290" class="s">oracle txs</text>
  <circle cx="726" cy="322" r="10" fill="#2563eb"/><text x="722" y="327" class="num">3</text>
  <circle cx="752" cy="322" r="10" fill="#059669"/><text x="748" y="327" class="num">5</text>

  <!-- Pi -> 0G -->
  <line x1="700" y1="455" x2="818" y2="455" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="708" y="444" class="s">ask Dyna</text>
  <circle cx="726" cy="476" r="10" fill="#7c3aed"/><text x="722" y="481" class="num">2</text>

  <!-- 0G -> Arc (episode root) -->
  <line x1="1250" y1="380" x2="1250" y2="332" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="1238" y="362" class="s" text-anchor="end">episode root → linkEpisode (sent by the Pi)</text>

  <!-- Pi -> Arkiv -->
  <polyline points="700,520 770,520 770,700 818,700" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="708" y="510" class="s">bridge</text>
  <circle cx="790" cy="610" r="10" fill="#475569"/><text x="786" y="615" class="num">6</text>

  <!-- hardware <-> Pi -->
  <line x1="200" y1="618" x2="200" y2="562" stroke="#475569" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="214" y="595" class="s">I²C meters · GPIO relays</text>
  <circle cx="186" cy="590" r="10" fill="#0f172a"/><text x="182" y="595" class="num">1</text>

  <!-- web reads Arkiv -->
  <polyline points="1090,800 1090,846 22,846 22,150 38,150" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="430" y="838" class="s">the web reads history, jobs and offers straight from Arkiv (scoped to the building's wallet)</text>

  <text x="1360" y="884" text-anchor="end" font-size="15" font-weight="700" fill="#0f172a">0G decides · Arc pays · Arkiv remembers</text>
  <text x="40" y="884" font-size="13" fill="#64748b">Dynaura · AI-run shared solar for one apartment building</text>
</svg>
